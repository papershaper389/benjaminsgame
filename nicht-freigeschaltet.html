<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Steinzeitdorf, kein Zugang</title>
<style>
  /* Bewusst eigenständig: Diese Seite erscheint, wenn der Zugriff auf css/style.css gesperrt ist. */
  :root { --bg: #ddd6c8; --fg: #2a221b; --muted: #675d4f; --accent: #9a6a10; --accent-ink: #fff7e8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1612; --fg: #efe5d4; --muted: #ab9d8a; --accent: #dba44a; --accent-ink: #1b1612; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 30rem; }
  h1 { margin: 0 0 12px; font: 400 32px/1.1 Georgia, "Times New Roman", serif; text-wrap: balance; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  a.btn { display: inline-block; min-height: 40px; padding: 8px 16px; box-sizing: border-box; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Kein Zugang</h1>
  <p>Dieses Konto ist für das Steinzeitdorf nicht freigeschaltet. Bitte den Betreiber um eine Einladung und den Einladungslink danach mit diesem Konto öffnen.</p>
  <p><a class="btn" href="/.auth/logout?post_logout_redirect_uri=/">Mit anderem Konto anmelden</a></p>
  <p class="muted">Die Anmeldung läuft über GitHub. Es werden nur Benutzername und Kennung geprüft.</p>
</main>
</body>
</html>
