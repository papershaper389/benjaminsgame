name: Deploy

# GitHub Pages hat pro Repository genau eine Seite. Darum baut jeder Lauf beide Umgebungen
# und veröffentlicht sie zusammen: main unter /, beta unter /beta/.
# Läuft bei jedem Push auf main. Pushes auf beta lösen diesen Workflow über beta-trigger.yml aus,
# weil die Umgebung "github-pages" standardmäßig nur vom Standard-Branch deployen darf.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (Prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout beta (Test)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta

      - name: Beide Umgebungen zusammenbauen
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          for env in prod beta; do
            SHA=$(git -C "$env" rev-parse --short HEAD)
            DATE=$(git -C "$env" log -1 --format=%cs)
            if [ "$env" = "prod" ]; then
              node "$env/scripts/stamp.mjs" prod "$env" site "$SHA" "$DATE" "$BASE"
            else
              node "$env/scripts/stamp.mjs" beta "$env" site/beta "$SHA" "$DATE" "${BASE}beta/"
            fi
          done
          touch site/.nojekyll
          find site -maxdepth 2 | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
