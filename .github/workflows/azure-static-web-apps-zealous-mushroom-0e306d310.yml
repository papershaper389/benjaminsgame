name: Azure Static Web Apps CI/CD (Beta)

# Test-Umgebung. Branch beta wird in der Static Web App "zealous-mushroom" veröffentlicht.
# Pull Requests gegen beta erzeugen eine Vorschau-Umgebung, die beim Schließen wieder verschwindet.
on:
  push:
    branches:
      - beta
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - beta
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Beta-Version zusammenbauen
        run: node scripts/stamp.mjs beta . dist "$(git rev-parse --short HEAD)" "$(git log -1 --format=%cs)" /
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MUSHROOM_0E306D310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # fertig zusammengebaute App aus dem Schritt davor
          api_location: "" # Api source code path - optional
          output_location: "" # nichts mehr zu bauen
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_MUSHROOM_0E306D310 }}
          action: "close"
